services:
  mysql:
    image: mysql:9.6
    container_name: artverse-mysql
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${DB_NAME:-artverse}
      MYSQL_USER: ${DB_USERNAME:-artverse}
      MYSQL_PASSWORD: ${DB_PASSWORD:-artverse}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root}
    ports:
      - "3306:3306"
    volumes:
      - artverse_mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -u${DB_USERNAME:-artverse} -p${DB_PASSWORD:-artverse} --silent"]
      interval: 5s
      timeout: 5s
      retries: 20

  opensearch:
    image: opensearchproject/opensearch:2.17.1
    container_name: artverse-opensearch
    restart: unless-stopped
    environment:
      discovery.type: single-node
      bootstrap.memory_lock: "true"
      OPENSEARCH_JAVA_OPTS: "-Xms512m -Xmx512m"
      DISABLE_INSTALL_DEMO_CONFIG: "true"
      DISABLE_SECURITY_PLUGIN: "true"
    ulimits:
      memlock:
        soft: -1
        hard: -1
    ports:
      - "9200:9200"
      - "9600:9600"
    volumes:
      - artverse_opensearch_data:/usr/share/opensearch/data

  backend:
    build:
      context: ./backend
    container_name: artverse-backend
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
      opensearch:
        condition: service_started
    environment:
      DB_URL: jdbc:mysql://mysql:3306/${DB_NAME:-artverse}?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
      DB_USERNAME: ${DB_USERNAME:-artverse}
      DB_PASSWORD: ${DB_PASSWORD:-artverse}
      JWT_SECRET: ${JWT_SECRET:-change-this-to-a-long-random-string-in-.env-minimum-32-chars}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:5173}
      OPENSEARCH_URL: http://opensearch:9200
      OPENSEARCH_ENABLED: ${OPENSEARCH_ENABLED:-true}
    ports:
      - "8080:8080"

  frontend:
    build:
      context: ./frontend
    container_name: artverse-frontend
    restart: unless-stopped
    depends_on:
      - backend
    environment:
      VITE_API_URL: ${VITE_API_URL:-http://localhost:8080/api/v1}
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - /app/node_modules

volumes:
  artverse_mysql_data:
  artverse_opensearch_data:
