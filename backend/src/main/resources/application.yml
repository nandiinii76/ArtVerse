spring:
  application:
    name: artverse-backend
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/artverse}
    username: ${DB_USERNAME:artverse}
    password: ${DB_PASSWORD:artverse}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
  flyway:
    enabled: true
    locations: classpath:db/migration
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
    consumer:
      group-id: ${KAFKA_CONSUMER_GROUP:artverse-events}
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer

server:
  port: ${SERVER_PORT:8080}

artverse:
  jwt:
    secret: ${JWT_SECRET:change-this-to-a-long-random-string-in-.env-minimum-32-chars}
    access-ttl-minutes: ${JWT_ACCESS_TTL_MINUTES:15}
    refresh-ttl-days: ${JWT_REFRESH_TTL_DAYS:30}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173}
  media:
    provider: ${MEDIA_PROVIDER:local}
    storage-dir: ${MEDIA_STORAGE_DIR:./data/media}
    cloudinary:
      cloud-name: ${CLOUDINARY_CLOUD_NAME:}
  search:
    opensearch-url: ${OPENSEARCH_URL:http://localhost:9200}
    opensearch-enabled: ${OPENSEARCH_ENABLED:true}
  kafka:
    enabled: ${KAFKA_ENABLED:false}
    topic: ${KAFKA_TOPIC:artverse.events}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: when-authorized

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html

logging:
  level:
    com.artverse: DEBUG
