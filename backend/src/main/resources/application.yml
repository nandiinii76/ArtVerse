spring:
  application:
    name: artverse-backend
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/artverse?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Kolkata}
    username: ${DB_USERNAME:artverse}
    password: ${DB_PASSWORD:artverse}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
        type:
          preferred_uuid_jdbc_type: CHAR
  flyway:
    enabled: true
    locations: classpath:db/migration

server:
  port: ${SERVER_PORT:8080}

artverse:
  jwt:
    secret: ${JWT_SECRET:change-this-to-a-long-random-string-in-.env-minimum-32-chars}
    access-ttl-minutes: ${JWT_ACCESS_TTL_MINUTES:15}
    refresh-ttl-days: ${JWT_REFRESH_TTL_DAYS:30}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173}
  media:
    provider: ${MEDIA_PROVIDER:local}
    storage-dir: ${MEDIA_STORAGE_DIR:./data/media}
    cloudinary:
      cloud-name: ${CLOUDINARY_CLOUD_NAME:}
  search:
    opensearch-url: ${OPENSEARCH_URL:http://localhost:9200}
    opensearch-enabled: ${OPENSEARCH_ENABLED:true}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: when-authorized

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html

logging:
  level:
    com.artverse: DEBUG
